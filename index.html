<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YK</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght:500;600;700;800&display=swap');

        :root{
            --main:#7c3aed; --accent:#ec4899; --dark:#010103; --panel:rgba(8,8,20,0.8);
            --text:#f8fafc; --muted:#94a3b8;
            --present:#10b981; --late:#f59e0b; --absent:#ef4444; --del:#f43f5e;
            --glow-soft:0 0 60px rgba(124,58,237,0.15);
            --glow-strong:0 0 80px rgba(124,58,237,0.25);
            --transition:all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body{
            min-height:100vh;color:var(--text);position:relative;overflow-x:hidden;
            background:radial-gradient(circle at 10% 0,#251b50 0%,#010103 60%);
        }

        /* === CINEMATIC ANIMATED BACKGROUND === */
        .bg{position:fixed;inset:0;z-index:-1;}
        .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.3;will-change:transform;}
        .o1{width:700px;height:700px;top:-250px;left:-200px;background:var(--main);animation:drift1 28s infinite ease-in-out;}
        .o2{width:800px;height:800px;bottom:-300px;right:-250px;background:var(--accent);animation:drift2 34s infinite ease-in-out;}
        .o3{width:500px;height:500px;top:30%;right:10%;background:var(--main);opacity:0.18;animation:drift3 42s infinite ease-in-out;}
        @keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(120px,70px) scale(1.08);}}
        @keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-90px,-110px) scale(0.92);}}
        @keyframes drift3{0%,100%{transform:translate(0,0) rotate(0deg);}50%{transform:translate(60px,-80px) rotate(180deg);}}

        .star{position:absolute;background:rgba(255,255,255,0.05);border-radius:50%;animation:rise 25s infinite ease-in-out;will-change:transform,opacity;}
        @keyframes rise{0%{transform:translateY(100vh) scale(0.5);opacity:0;}20%{opacity:1;transform:translateY(80vh) scale(1);}80%{opacity:1;transform:translateY(-50px) scale(0.8);}100%{transform:translateY(-150px) scale(0.3);opacity:0;}}

        /* === WELCOME PAGE === */
        #welcomePage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:60px;position:relative;z-index:1;}
        .title{
            font-size:82px;font-weight:800;letter-spacing:4px;
            background:linear-gradient(90deg,var(--main),var(--accent),var(--main));background-size:200% auto;
            -webkit-background-clip:text;color:transparent;
            animation:heroIn 1.2s cubic-bezier(0.2,0.85,0.2,1), shine 8s linear infinite;
        }
        @keyframes heroIn{from{opacity:0;transform:translateY(40px) scale(0.92);}}
        @keyframes shine{to{background-position:200% center;}}
        .btn-main{
            padding:22px 72px;font-size:21px;font-weight:600;border-radius:20px;border:none;
            background:linear-gradient(135deg,var(--main),var(--accent));color:white;
            cursor:pointer;transition:var(--transition);box-shadow:var(--glow-soft);
            position:relative;overflow:hidden;
        }
        .btn-main::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transform:translateX(-100%);transition:transform 0.4s ease;}
        .btn-main:hover::before{transform:translateX(100%);}
        .btn-main:hover{transform:translateY(-6px);box-shadow:var(--glow-strong);}

        /* === ATTENDANCE PAGE === */
        #attendPage{display:none;padding:45px 28px;max-width:1150px;margin:0 auto;position:relative;z-index:1;animation:pageIn 0.4s ease;}
        @keyframes pageIn{from{opacity:0;transform:translateX(20px);}}
        .top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:32px;}
        .back{color:var(--muted);cursor:pointer;font-size:15px;transition:var(--transition);display:flex;align-items:center;gap:4px;}
        .back:hover{color:white;transform:translateX(-6px);}
        h2{font-size:34px;font-weight:700;color:var(--main);letter-spacing:1px;}
        input{
            padding:14px 20px;border-radius:16px;border:1px solid rgba(124,58,237,0.3);
            background:rgba(8,8,20,0.6);color:white;outline:none;transition:var(--transition);
            font-size:15px;
        }
        input:focus{border-color:var(--main);box-shadow:0 0 25px rgba(124,58,237,0.2);background:rgba(8,8,20,0.8);}

        .search-bar{margin-bottom:26px;}
        #search{width:100%;}
        .result{
            padding:18px 22px;border-radius:16px;margin-bottom:26px;display:none;
            font-weight:500;backdrop-filter:blur(20px);transition:var(--transition);
            transform-origin:top;
        }
        .result.show{display:block;animation:fadeUp 0.4s cubic-bezier(0.2,0.8,0.2,1);}
        @keyframes fadeUp{from{opacity:0;transform:translateY(12px) scaleY(0.95);}}
        .g{background:rgba(16,185,129,0.08);border:1px solid var(--present);color:var(--present);}
        .m{background:rgba(245,158,11,0.08);border:1px solid var(--late);color:var(--late);}
        .b{background:rgba(239,68,68,0.08);border:1px solid var(--absent);color:var(--absent);}

        .add-row{display:flex;gap:16px;margin-bottom:30px;}
        #newName{flex:1;}
        .btn-add{
            padding:14px 32px;border-radius:16px;border:none;background:var(--main);
            color:white;font-weight:600;cursor:pointer;transition:var(--transition);
            position:relative;overflow:hidden;
        }
        .btn-add::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);transform:translateX(-100%);transition:transform 0.3s ease;}
        .btn-add:hover::before{transform:translateX(100%);}
        .btn-add:hover{background:#6d28d9;transform:translateY(-3px);}

        .list{
            background:var(--panel);backdrop-filter:blur(24px);border-radius:20px;
            border:1px solid rgba(124,58,237,0.18);overflow:hidden;box-shadow:var(--glow-soft);
        }
        .head,.row{display:flex;padding:20px 28px;align-items:center;transition:var(--transition);}
        .head{background:rgba(124,58,237,0.08);font-weight:600;font-size:15px;letter-spacing:0.8px;}
        .row{border-bottom:1px solid rgba(255,255,255,0.03);}
        .row:last-child{border:none;}
        .row:hover{background:rgba(255,255,255,0.015);transform:translateX(4px);}
        .n{flex:2;}
        .c{width:95px;text-align:center;}
        .s{width:110px;text-align:center;font-weight:600;}
        .d{width:75px;text-align:center;}
        .btn{
            padding:10px 18px;border-radius:14px;border:none;color:white;font-weight:600;
            cursor:pointer;transition:var(--transition);position:relative;overflow:hidden;
        }
        .btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.1);opacity:0;transition:opacity 0.2s ease;}
        .btn:active::after{opacity:1;}
        .btn.active{outline:2px solid white;outline-offset:4px;box-shadow:0 0 18px currentColor;transform:scale(1.05);}
        .p{background:var(--present);}
        .l{background:var(--late);}
        .a{background:var(--absent);}
        .x{background:var(--del);}

        @media(max-width:640px){
            .title{font-size:52px;letter-spacing:2px;}
            .head,.row{font-size:13px;padding:16px 20px;}
            .btn{padding:8px 14px;font-size:12px;}
            .btn-main{padding:18px 52px;font-size:18px;}
        }
    </style>
</head>
<body>

<!-- PREMIUM BACKGROUND -->
<div class="bg">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
    <script>for(let i=0;i<50;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*3+1;s.style.width=s.style.height=sz+'px';s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*25+'s';document.querySelector('.bg').appendChild(s);}</script>
</div>

<!-- WELCOME SCREEN -->
<div id="welcomePage">
    <h1 class="title">WELCOME TO YK</h1>
    <button class="btn-main" onclick="go()">ATTENDANCE</button>
</div>

<!-- ATTENDANCE SYSTEM -->
<div id="attendPage">
    <div class="top-bar">
        <span class="back" onclick="back()">← Back</span>
        <h2>ATTENDANCE</h2>
        <input type="date" id="date">
    </div>

    <div class="search-bar">
        <input type="text" id="search" placeholder="Search member name..." oninput="check()">
    </div>
    <div class="result" id="out"></div>

    <div class="add-row">
        <input type="text" id="newName" placeholder="Add new team member...">
        <button class="btn-add" onclick="add()">ADD</button>
    </div>

    <div class="list">
        <div class="head">
            <div class="n">Name</div>
            <div class="c">Present</div>
            <div class="c">Late</div>
            <div class="c">Absent</div>
            <div class="s">Score</div>
            <div class="d"></div>
        </div>
        <div id="items"></div>
    </div>
</div>

<script>
// === YOUR EXACT RULES LOCKED IN ===
const START=100,ADD=0.01,LATE=0.5,ABSENT=1,MAX=100,MIN=0;
let names=JSON.parse(localStorage.getItem('ykNames')||'[]');
let data=JSON.parse(localStorage.getItem('ykData')||'{}');
let day=new Date().toISOString().split('T')[0];
document.getElementById('date').value=day;

function go(){document.getElementById('welcomePage').style.display='none';document.getElementById('attendPage').style.display='block';draw();}
function back(){document.getElementById('attendPage').style.display='none';document.getElementById('welcomePage').style.display='flex';}
document.getElementById('date').onchange=e=>{day=e.target.value;save();draw();check();};

function add(){const n=document.getElementById('newName').value.trim();if(!n||names.includes(n))return;names.push(n);document.getElementById('newName').value='';save();draw();}
function del(n){if(!confirm('Remove '+n+' and all their records?'))return;names=names.filter(x=>x!==n);Object.values(data).forEach(d=>delete d[n]);save();draw();check();}
function mark(n,s){if(!data[day])data[day]={};data[day][n]=s;save();draw();check();}

function calc(n){let sc=START;Object.values(data).forEach(d=>{const s=d[n];if(s==='present'&&sc<MAX)sc=Math.min(MAX,sc+ADD);if(s==='late')sc=Math.max(MIN,sc-LATE);if(s==='absent')sc=Math.max(MIN,sc-ABSENT);});return Math.round(sc*100)/100;}
function check(){const q=document.getElementById('search').value.trim().toLowerCase();const b=document.getElementById('out');if(!q){b.classList.remove('show');return;}const f=names.find(n=>n.toLowerCase().includes(q));if(!f){b.classList.remove('show');return;}const p=calc(f);b.className='result show '+(p>=95?'g':p>=80?'m':'b');b.innerHTML=`<strong>${f}</strong> — Attendance Score: <strong>${p}%</strong>`;}
function save(){localStorage.setItem('ykNames',JSON.stringify(names));localStorage.setItem('ykData',JSON.stringify(data));}
function draw(){if(!data[day])data[day]={};const l=document.getElementById('items');l.innerHTML='';names.forEach(n=>{const s=data[day][n]||'';const p=calc(n);l.innerHTML+=`<div class="row"><div class="n">${n}</div><div class="c"><button class="btn p ${s==='present'?'active':''}" onclick="mark('${n}','present')">P</button></div><div class="c"><button class="btn l ${s==='late'?'active':''}" onclick="mark('${n}','late')">L</button></div><div class="c"><button class="btn a ${s==='absent'?'active':''}" onclick="mark('${n}','absent')">A</button></div><div class="s">${p}%</div><div class="d"><button class="btn x" onclick="del('${n}')">X</button></div></div>`;});}
</script>
</body>
</html>
