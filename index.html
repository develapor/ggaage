<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YK ESPORTS</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root{
            --main:#7c3aed; --accent:#ec4899; --dark:#05050a; --panel:#11111b;
            --text:#f8fafc; --muted:#94a3b8; --success:#10b981;
        }

        body{
            min-height:100vh; background:radial-gradient(circle at 10% 0,#1e1b4b 0%,var(--dark) 60%);
            color:var(--text); font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; padding:20px;
        }

        .container{
            width:100%; max-width:520px; background:rgba(8,8,16,0.9); backdrop-filter:blur(20px);
            border:1px solid rgba(124,58,237,0.25); border-radius:24px; padding:40px;
            box-shadow:0 0 50px rgba(124,58,237,0.15); animation:fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px);}}

        .header{text-align:center; margin-bottom:32px;}
        .logo{font-size:42px; font-weight:800; background:linear-gradient(90deg,var(--main),var(--accent)); -webkit-background-clip:text; color:transparent; margin-bottom:8px;}
        .tagline{font-size:15px; color:var(--muted);}

        .form-group{margin-bottom:18px;}
        label{display:block; font-size:14px; font-weight:500; margin-bottom:6px; color:var(--muted);}
        input{
            width:100%; padding:14px 18px; border-radius:12px; border:1px solid rgba(124,58,237,0.3);
            background:rgba(17,17,27,0.8); color:var(--text); font-size:15px; outline:none; transition:0.2s;
        }
        input:focus{border-color:var(--main); box-shadow:0 0 15px rgba(124,58,237,0.15);}

        .btn{
            width:100%; padding:14px; border-radius:12px; border:none; background:linear-gradient(135deg,var(--main),var(--accent));
            color:white; font-weight:600; font-size:16px; cursor:pointer; transition:0.2s; margin-top:8px;
        }
        .btn:hover{transform:translateY(-2px); box-shadow:0 8px 25px rgba(124,58,237,0.25);}

        .success{text-align:center; margin-top:16px; color:var(--success); font-size:14px; display:none;}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">WELCOME TO YK ESPORTS</div>
        <p class="tagline">Join the team • Compete • Win</p>
    </div>

    <form id="regForm">
        <div class="form-group">
            <label>Full Name / Username</label>
            <input type="text" id="name" required placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>Email / Contact</label>
            <input type="text" id="contact" required placeholder="Your email or Discord">
        </div>

        <div class="form-group">
            <label>Game / Role</label>
            <input type="text" id="role" required placeholder="e.g. FIFA, Roblox, Manager">
        </div>

        <button type="submit" class="btn">REGISTER NOW</button>
        <div class="success" id="msg">✅ Registered Successfully! Welcome to YK ESPORTS</div>
    </form>
</div>

<script>
const form = document.getElementById('regForm');
const msg = document.getElementById('msg');

form.addEventListener('submit', e=>{
    e.preventDefault();
    msg.style.display = 'block';
    form.reset();
    setTimeout(()=>msg.style.display='none',5000);
});
</script>

</body>
</html>
